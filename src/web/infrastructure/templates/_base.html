<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hakkurin{% endblock %}</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a23;
            --text-color: #e0e0e0;
            --accent-color: #ff79c6;
            /* Rosa neón */
            --secondary-accent: #bd93f9;
            /* Púrpura */
            --input-bg: #2b2b3b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            text-shadow: 0 0 10px var(--accent-color);
            margin-bottom: 30px;
        }

        h2 {
            color: var(--secondary-accent);
            text-align: center;
            margin-top: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary-accent);
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(255, 121, 198, 0.5);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(45deg, var(--accent-color), var(--secondary-accent));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(189, 147, 249, 0.4);
        }

        .alert {
            padding: 15px;
            background-color: rgba(80, 250, 123, 0.2);
            border: 1px solid #50fa7b;
            color: #50fa7b;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .hint {
            font-size: 0.85em;
            color: #888;
            margin-top: 6px;
        }

        .badge-ok {
            background: rgba(80, 250, 123, 0.2);
            color: #50fa7b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .badge-no {
            background: rgba(255, 85, 85, 0.2);
            color: #ff5555;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .memory-list {
            list-style: none;
            padding: 0;
        }

        .memory-item {
            background-color: var(--card-bg);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            transition: transform 0.2s;
        }

        .memory-item:hover {
            transform: translateX(5px);
            border-color: var(--secondary-accent);
        }

        .memory-item.internal-memory {
            border-color: var(--accent-color);
        }

        .user-id {
            font-weight: bold;
            color: var(--secondary-accent);
        }

        .date {
            color: #888;
            font-size: 0.9em;
        }

        .memory-list a {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
        }

        .content-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            white-space: pre-wrap;
            line-height: 1.6;
            font-family: 'Segoe UI', monospace;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block body %}{% endblock %}
    </div>

    {% block script %}{% endblock %}
</body>

</html>
