<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hakkurin{% endblock %}</title>
    <style>
        :root {
            --bg: #0b0d10;
            --card: #14171c;
            --border: #23272f;
            --accent: #f5a623;
            --text: #e6e9ee;
            --muted: #8b93a1;
            --ok: #3fb950;
            --bad: #f85149;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .head-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 18px;
        }

        nav a:hover {
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        h1 {
            font-size: 1.35rem;
            margin: 0 0 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            background: #0f1216;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .checkbox {
            width: auto;
            accent-color: var(--accent);
        }

        .check-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-group label {
            margin: 0;
        }

        button {
            background: var(--accent);
            color: #14171c;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .btn-danger {
            background: var(--bad);
            color: #fff;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.85rem;
        }

        .hint {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 5px;
        }

        .muted {
            color: var(--muted);
        }

        .badge-ok,
        .badge-no {
            font-size: 0.78rem;
            padding: 1px 8px;
            border-radius: 6px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: 400;
        }

        .badge-ok {
            color: var(--ok);
            border: 1px solid rgba(63, 185, 80, 0.4);
        }

        .badge-no {
            color: var(--bad);
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        .chip {
            font-size: 0.78rem;
            padding: 1px 8px;
            border-radius: 6px;
            background: rgba(245, 166, 35, 0.12);
            color: var(--accent);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-ok {
            background: var(--ok);
        }

        .dot-bad {
            background: var(--bad);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-weight: 600;
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Pestañas por radios ocultos: display:none NO impide que los inputs
           ocultos se envíen con el form, así un solo form cubre todas las pestañas. */
        .tabs>input[type="radio"] {
            display: none;
        }

        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .tab-nav label {
            padding: 8px 14px;
            cursor: pointer;
            color: var(--muted);
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            margin-bottom: -1px;
        }

        .tab-panel {
            display: none;
        }

        #t-general:checked~.tab-nav label[for="t-general"],
        #t-ia:checked~.tab-nav label[for="t-ia"],
        #t-voz:checked~.tab-nav label[for="t-voz"],
        #t-navidrome:checked~.tab-nav label[for="t-navidrome"],
        #t-stats:checked~.tab-nav label[for="t-stats"],
        #t-peligro:checked~.tab-nav label[for="t-peligro"] {
            color: var(--accent);
            border-color: var(--border);
            background: var(--bg);
        }

        #t-general:checked~form #p-general,
        #t-ia:checked~form #p-ia,
        #t-voz:checked~form #p-voz,
        #t-navidrome:checked~form #p-navidrome {
            display: block;
        }

        #t-stats:checked~#p-stats,
        #t-peligro:checked~#p-peligro {
            display: block;
        }

        #t-stats:checked~form,
        #t-peligro:checked~form {
            display: none;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: var(--card);
            border: 1px solid var(--ok);
            color: var(--ok);
            padding: 12px 18px;
            border-radius: 8px;
            display: none;
            z-index: 10;
        }

        .status-head {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .status-grid .label {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .status-grid .value {
            font-size: 0.95rem;
            overflow-wrap: anywhere;
        }

        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .row-end {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            display: inline-block;
        }

        .memory-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .memory-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .memory-item.internal-memory {
            border-color: var(--accent);
        }

        .memory-link {
            text-decoration: none;
            color: inherit;
            min-width: 0;
        }

        .content-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <header>
        <div class="head-inner">
            <a href="/" class="brand">Hakkurin</a>
            <nav>
                <a href="/">Inicio</a>
                <a href="/memories">Memorias</a>
                <a href="/logs">Logs</a>
            </nav>
        </div>
    </header>
    <div class="container">
        {% block body %}{% endblock %}
    </div>

    {% block script %}{% endblock %}
</body>

</html>
