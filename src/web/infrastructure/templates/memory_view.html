{% extends '_base.html' %}
{% block title %}Memoria: {{ user_id }}{% endblock %}
{% block body %}
<div class="row-between">
    <a href="/memories" class="back-btn">← Volver a la lista</a>
    <form action="/memories/{{ user_id }}/delete" method="post"
        onsubmit="return confirm('¿Borrar la memoria de {{ user_id }}?');">
        <button type="submit" class="btn-danger btn-sm">Borrar memoria</button>
    </form>
</div>
<h1>Memoria de {{ user_id }}</h1>
<div class="content-box">{{ content }}</div>
{% endblock %}
