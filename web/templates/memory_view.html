<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria: {{ user_id }}</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a23;
            --text-color: #e0e0e0;
            --accent-color: #ff79c6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .content-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/memories" class="back-btn">← Volver a la lista</a>
        <h1>Memoria de {{ user_id }}</h1>
        <div class="content-box">{{ content }}</div>
    </div>
</body>

</html>
