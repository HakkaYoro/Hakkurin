name: Docker Build & Publish

# Autobuild sólo en main. Otras ramas (legacy-python, features) NO publican imagen.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME se definirá dinámicamente en los pasos para asegurar minúsculas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El sidecar yt-dlp (contexto ./sidecar) también se publica: el NAS despliega
      # con imágenes de GHCR (no buildea local), sin este push no existe el
      # contenedor `sidecar` y el bot resuelve ENOTFOUND.
      - name: Build and push sidecar image (yt-dlp)
        uses: docker/build-push-action@v5
        with:
          context: ./sidecar
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sidecar:latest
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
