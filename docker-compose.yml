services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "30421:8000"
    volumes:
      # Volumen único para toda la persistencia (config + memoria + holidays/status)
      - hakkurin_data:/app/data
    environment:
      - NODE_ENV=production
    depends_on:
      sidecar:
        condition: service_healthy

  # Sidecar yt-dlp: interno (no expone puerto al host). El bot lo alcanza en
  # http://sidecar:7654 — setear ytdl_sidecar_url en la WebUI a ese valor.
  sidecar:
    build: ./sidecar
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7654/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  hakkurin_data:
