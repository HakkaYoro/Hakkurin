services:
  bot:
    # Dual: `docker compose build` genera y tagea la imagen de GHCR; en el NAS
    # (sin build) `docker compose pull && up -d` usa la publicada por Actions.
    build: .
    image: ghcr.io/hakkayoro/hakkurin:latest
    restart: unless-stopped
    ports:
      - "30421:8000"
    volumes:
      # Volumen único para toda la persistencia (config + memoria + holidays/status)
      - hakkurin_data:/app/data
    environment:
      - NODE_ENV=production
      # Fija la URL del sidecar a nivel de entorno (precedencia sobre config.json):
      # elimina el paso manual de setear ytdl_sidecar_url en la WebUI.
      - YTDL_SIDECAR_URL=http://sidecar:7654
    depends_on:
      sidecar:
        condition: service_healthy

  # Sidecar yt-dlp: interno (no expone puerto al host). El bot lo alcanza en
  # http://sidecar:7654 — fijo arriba vía env YTDL_SIDECAR_URL.
  sidecar:
    build: ./sidecar
    image: ghcr.io/hakkayoro/hakkurin-sidecar:latest
    restart: unless-stopped
    environment:
      # Logs de uvicorn sin buffering cuando stdout es un pipe (docker logs).
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7654/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  hakkurin_data:
