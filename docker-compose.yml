services:
  hakkurin:
    image: ghcr.io/hakkayoro/hakkurin:latest
    restart: unless-stopped
    ports:
      - "30421:8000"
    volumes:
      # Volumen único para toda la persistencia (config y memoria)
      - hakkurin_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  hakkurin_data:


